<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d1519">
<title>Puerta · XV Ashley</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#1d1519;color:#fff;min-height:100svh;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font:600 12px system-ui;letter-spacing:.3em;text-transform:uppercase;color:#e9cf87;margin-top:6px}
.card{width:100%;max-width:440px}
input{width:100%;padding:16px;border-radius:12px;border:1px solid #5a4a51;background:#2a2025;color:#fff;font-size:20px;text-align:center;letter-spacing:.2em}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#e9cf87;color:#3b2a1a;font-size:16px;font-weight:600;margin-top:12px}
button.sec{background:#3b2f34;color:#eadde2}
#reader{width:100%;max-width:440px;border-radius:16px;overflow:hidden;background:#2a2025;min-height:260px;border:2px solid #e9cf87}
#counters{display:flex;gap:10px;width:100%;max-width:440px}
#counters div{flex:1;background:#2a2025;border-radius:12px;padding:10px;text-align:center}
#counters b{display:block;font-size:26px}
#counters span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#cdb9c0}
#result{width:100%;max-width:440px;border-radius:18px;padding:22px 16px;text-align:center;background:#2a2025;color:#cdb9c0;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:4px}
#result.ok{background:#1f7a3a;color:#fff}
#result.used,#result.bad{background:#a3262a;color:#fff}
#result.warn{background:#a4761a;color:#fff}
#result .big{font-size:30px;font-weight:700}
#result .who{font-size:22px}
#result .sub{font-size:15px;opacity:.9}
details{width:100%;max-width:440px;background:#2a2025;border-radius:12px;padding:12px}
summary{cursor:pointer;color:#e9cf87}
#q{font-size:16px;letter-spacing:0;text-align:left;margin-top:10px;padding:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #3b2f34;font-size:15px}
.item small{display:block;color:#cdb9c0;font-size:12px}
.item button{width:auto;margin:0;padding:8px 14px;font-size:13px}
#err{color:#ff9a9a;text-align:center;min-height:18px;margin-top:8px;font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Vigilante · Puerta</h1>

<!-- Login -->
<div class="card" id="login">
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
  <button id="loginBtn">Entrar</button>
  <div id="err" role="alert"></div>
</div>

<!-- Escáner -->
<div id="app" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
  <div id="counters">
    <div><b id="cIn">–</b><span>Ya ingresaron</span></div>
    <div><b id="cExp">–</b><span>Esperados</span></div>
  </div>
  <div id="reader"></div>
  <div id="result">Apunta la cámara al QR del invitado</div>
  <details>
    <summary>Búsqueda manual por nombre</summary>
    <input id="q" placeholder="Escribe al menos 2 letras…" autocomplete="off">
    <div id="list"></div>
  </details>
  <button class="sec card" id="camBtn">Reiniciar cámara</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const hora = (iso) => new Date(iso).toLocaleTimeString('es-PE', { timeZone: 'America/Lima', hour: 'numeric', minute: '2-digit' });
const pers = (n) => `${n} ${n === 1 ? 'persona' : 'personas'}`;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(d.error || 'Error'), { status: r.status });
  return d;
}

/* ---------- Login ---------- */
async function login() {
  $('err').textContent = '';
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({ role: 'gate', secret: $('pin').value }) });
    startApp();
  } catch (e) { $('err').textContent = e.status === 401 ? 'PIN incorrecto' : 'Sin conexión, intenta de nuevo'; }
}
$('loginBtn').onclick = login;
$('pin').addEventListener('keydown', (e) => e.key === 'Enter' && login());

/* ---------- Resultado ---------- */
function showResult(r) {
  const el = $('result');
  el.className = '';
  if (navigator.vibrate) navigator.vibrate(r.result === 'ok' ? 120 : [200, 100, 200]);
  if (r.result === 'ok') {
    el.className = 'ok';
    el.innerHTML = `<div class="big">✔ INGRESO OK</div><div class="who">${esc(r.name)}</div><div class="sub">${pers(r.partySize)}</div>`;
  } else if (r.result === 'used') {
    el.className = 'used';
    el.innerHTML = `<div class="big">✖ YA INGRESÓ</div><div class="who">${esc(r.name)}</div><div class="sub">Escaneado a las ${hora(r.at)} · no dejar pasar</div>`;
  } else if (r.result === 'not_confirmed') {
    el.className = 'warn';
    el.innerHTML = `<div class="big">⚠ SIN CONFIRMAR</div><div class="who">${esc(r.name)}</div><div class="sub">No confirmó asistencia. Consulta con la familia.</div>`;
  } else {
    el.className = 'bad';
    el.innerHTML = `<div class="big">✖ QR NO VÁLIDO</div><div class="sub">No pertenece a esta fiesta</div>`;
  }
  refreshCounters();
}

async function checkin(code) {
  try { showResult(await api('/api/checkin', { method: 'POST', body: JSON.stringify({ code }) })); }
  catch (e) {
    if (e.status === 401) return location.reload();
    $('result').className = 'warn';
    $('result').innerHTML = '<div class="big">⚠ SIN CONEXIÓN</div><div class="sub">No se pudo validar. Usa la búsqueda manual o reintenta.</div>';
  }
}

/* ---------- Cámara ---------- */
let scanner = null, busy = false, last = { code: '', t: 0 };
async function startCamera() {
  try { if (scanner && scanner.isScanning) await scanner.stop(); } catch {}
  try {
    scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } }, async (text) => {
      const now = Date.now();
      if (busy || (text === last.code && now - last.t < 4000)) return;
      busy = true; last = { code: text, t: now };
      await checkin(text);
      setTimeout(() => (busy = false), 1500);
    }, () => {});
  } catch (e) {
    $('reader').innerHTML = '<p style="padding:24px;font-size:14px">No se pudo abrir la cámara. Da permiso de cámara al navegador y pulsa “Reiniciar cámara”, o usa la búsqueda manual.</p>';
  }
}
$('camBtn').onclick = startCamera;

/* ---------- Contadores y búsqueda manual ---------- */
async function refreshCounters(q = '') {
  try {
    const d = await api('/api/checkin' + (q ? '?q=' + encodeURIComponent(q) : ''));
    $('cIn').textContent = d.counters.inside; $('cExp').textContent = d.counters.expected;
    return d.results;
  } catch (e) { if (e.status === 401) location.reload(); }
}
let tmr;
$('q').addEventListener('input', () => {
  clearTimeout(tmr);
  tmr = setTimeout(async () => {
    const q = $('q').value.trim();
    if (q.length < 2) { $('list').innerHTML = ''; return; }
    const res = (await refreshCounters(q)) || [];
    $('list').innerHTML = res.length ? res.map((g) => `
      <div class="item"><div>${esc(g.name)}<small>${pers(g.partySize)}${g.checkedInAt ? ' · ingresó ' + hora(g.checkedInAt) : ''}</small></div>
      <button data-c="${esc(g.code)}" ${g.checkedInAt ? 'class="sec"' : ''}>${g.checkedInAt ? 'Ya ingresó' : 'Registrar'}</button></div>`).join('')
      : '<p style="padding:10px 0;color:#cdb9c0;font-size:14px">Sin coincidencias entre los confirmados.</p>';
  }, 300);
});
$('list').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  await checkin(b.dataset.c);
  $('q').dispatchEvent(new Event('input'));
};

/* ---------- Inicio ---------- */
function startApp() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  refreshCounters(); startCamera();
  setInterval(() => refreshCounters(), 15000);
}
// Si ya hay sesión activa, entra directo
fetch('/api/checkin').then((r) => { if (r.ok) startApp(); }).catch(() => {});
</script>
</body>
</html>
